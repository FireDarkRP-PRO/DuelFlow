<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tournoi Pokémon</title>
<link rel="stylesheet" href="../Ressource/style.css">
</head>
<body>
<main>
  <p class="meta"><a href="../index.html">← Tous les tournois</a></p>
  <h1>Tournoi Pokémon</h1>

  <section id="setup">
    <p class="sous">Les Pokémon s'affrontent deux par deux jusqu'à ton préféré.</p>
    <div class="panneau">
      <div class="params">
        <label class="champ">Sauvegarde (facultatif) : sans elle, c'est un nouveau tournoi
          <input type="file" id="import" accept=".json,application/json">
        </label>
      </div>
      <div class="params">
        <div class="champ" style="grid-column:1/-1">Générations qui participent
          <div class="grille-gen" id="gens"></div>
        </div>
        <label class="champ">Pokémon par groupe
          <input type="number" id="P" min="2" value="4"></label>
        <label class="champ case"><input type="checkbox" id="tableau" checked> Tableau Upper/Lower Bracket</label>
        <label class="champ" id="blocX">Le tableau commence à
          <select id="X">
            <option value="16">16ème de finale</option>
            <option value="8" selected>8ème de finale</option>
            <option value="4">4ème de finale (quarts)</option>
            <option value="2">2ème de finale (demi-finales)</option>
          </select></label>
        <div class="duo">
          <label class="champ">Points par victoire
            <input type="number" id="Y" value="3"></label>
          <label class="champ">Points perdus par défaite
            <input type="number" id="Z" min="0" value="0"></label>
        </div>
      </div>
      <p class="meta" id="info" aria-live="polite">Chargement de la liste des Pokémon…</p>
      <div class="barre">
        <button class="principal" id="lancer" disabled>Lancer le tournoi</button>
        <button id="retirer" hidden>Retirer la sauvegarde</button>
      </div>
    </div>
  </section>

  <section id="duel" hidden>
    <div class="panneau">
      <div class="etiquette" id="etiquette"></div>
      <div class="meta" id="progression"></div>
      <ul class="scores" id="scores"></ul>
    </div>
    <div class="duel" id="cartes"></div>
    <p class="meta">Raccourcis : touche 1 pour la gauche, touche 2 pour la droite. Données et images : PokéAPI.</p>
    <div class="barre">
      <button id="exp">Exporter la sauvegarde</button>
      <button id="quit">Abandonner</button>
    </div>
  </section>

  <section id="fin" hidden>
    <div id="champion"></div>
    <div class="barre">
      <button id="exp2">Exporter la sauvegarde</button>
      <button class="principal" id="nouveau">Nouveau tournoi</button>
    </div>
  </section>
</main>

<script src="../Ressource/tournoi.js"></script>
<script>
const $ = s => document.querySelector(s);
const TYPE = 'tournoi-pokemon';
const TYPES = {
  normal: ['Normal', '#a8a77a'], fire: ['Feu', '#ee8130'], water: ['Eau', '#6390f0'], electric: ['Électrik', '#f7d02c'],
  grass: ['Plante', '#7ac74c'], ice: ['Glace', '#96d9d6'], fighting: ['Combat', '#c22e28'], poison: ['Poison', '#a33ea1'],
  ground: ['Sol', '#e2bf65'], flying: ['Vol', '#a98ff3'], psychic: ['Psy', '#f95587'], bug: ['Insecte', '#a6b91a'],
  rock: ['Roche', '#b6a136'], ghost: ['Spectre', '#735797'], dragon: ['Dragon', '#6f35fc'], dark: ['Ténèbres', '#705746'],
  steel: ['Acier', '#b7b7ce'], fairy: ['Fée', '#d685ad']
};
const STATS = { hp: 'PV', attack: 'Attaque', defense: 'Défense', 'special-attack': 'Att. Spé.', 'special-defense': 'Déf. Spé.', speed: 'Vitesse' };

let tous = [], gens = [], save = null, params = {}, t = null, cri = null;
const idDe = k => parseInt(k, 10);
const nomDe = k => k.replace(/^\d+\s+/, '');
const genDe = k => { const i = gens.findIndex(g => idDe(k) >= g.min && idDe(k) <= g.max); return i < 0 ? 'x' : i; };
const nomsSave = s => s.etape === 'bracket' ? [...s.upper, ...s.lower] : s.etape === 'groupes' ? s.musiques : [s.champion];
const lireParams = () => ({ tableau: $('#tableau').checked, P: Math.max(2, +$('#P').value || 4), X: Math.max(1, +$('#X').value || 8), Y: +$('#Y').value, Z: Math.max(0, +$('#Z').value || 0) });
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };

/* Listes : Ressource/Pokemon/pokemon.txt (« 0001 Bulbizarre ») et genPokemon.txt (« Gen1:1-151 ») */
const lire = u => fetch(u).then(r => { if (!r.ok) throw new Error(u); return r.text(); });
Promise.all([lire('../Ressource/Pokemon/pokemon.txt'), lire('../Ressource/Pokemon/genPokemon.txt').catch(() => '')])
  .then(([txt, gtxt]) => {
    tous = [...new Set(txt.split(/\r?\n/).map(l => l.match(/^\s*(\d+)\s+(.+?)\s*$/)).filter(Boolean).map(m => `${m[1]} ${m[2]}`))];
    gens = gtxt.split(/\r?\n/).map(l => l.match(/^\s*(.+?)\s*:\s*(\d+)\s*-\s*(\d+)/)).filter(Boolean).map(m => ({ nom: m[1], min: +m[2], max: +m[3] }));
    construireGens(); majInfo();
  })
  .catch(() => { $('#info').textContent = "Impossible de lire Ressource/Pokemon/pokemon.txt. Ouvre le site via GitHub Pages (ou un serveur local), pas en double-cliquant sur le fichier."; });

/* Cases à cocher des générations, construites depuis genPokemon.txt */
function construireGens() {
  const liste = gens.map((g, i) => [i, g.nom.replace(/^gen\s*(\d+)/i, 'Gén. $1')]);
  liste.push(['x', gens.length ? 'Autres numéros' : 'Tous les Pokémon']);
  $('#gens').replaceChildren(...liste.map(([i, nom]) => {
    const l = el('label', 'champ case');
    const c = document.createElement('input'); c.type = 'checkbox'; c.checked = true; c.dataset.gen = i; c.onchange = majInfo;
    l.append(c, nom);
    return l;
  }));
}
const participants = () => tous.filter(k => { const c = $(`#gens input[data-gen="${genDe(k)}"]`); return !c || c.checked; });

function majInfo() {
  const m = [];
  if (save) {
    const noms = nomsSave(save);
    m.push(`Sauvegarde chargée : ${noms.length} Pokémon encore en lice.`);
    if (save.etape === 'groupes' && save.restants) m.push(`Reprise à la phase ${save.phase}, groupe ${save.gagnants.length + 1} sur ${save.gagnants.length + save.restants.length}.`);
  } else if (tous.length) {
    m.push(`${tous.length} Pokémon dans la liste, ${participants().length} participent.`);
    if (!$('#tableau').checked) m.push(+$('#P').value === 2 ? 'Sans tableau et avec 2 Pokémon par groupe : 1 contre 1 pur.' : "Sans tableau : les groupes s'enchaînent jusqu'à un seul gagnant (mets 2 Pokémon par groupe pour du 1 contre 1 pur).");
  } else return;
  $('#info').textContent = m.join(' ');
  $('#lancer').disabled = save ? false : participants().length < 2;
  ['P', 'X', 'Y', 'Z', 'tableau'].forEach(k => $('#' + k).disabled = !!save);
  document.querySelectorAll('#gens input').forEach(c => c.disabled = !!save);
  $('#blocX').hidden = !$('#tableau').checked;
  $('#retirer').hidden = !save;
}

$('#import').onchange = async e => {
  try {
    const d = await Sauvegarde.importer(e.target.files[0], TYPE);
    const ok = (d.etape === 'groupes' && Array.isArray(d.musiques) && (!d.restants || Array.isArray(d.gagnants))) || (d.etape === 'bracket' && Array.isArray(d.upper) && Array.isArray(d.lower)) || (d.etape === 'termine' && d.champion);
    if (!ok) throw new Error('sauvegarde illisible ou incomplète.');
    save = d;
    for (const k of ['P', 'X', 'Y', 'Z']) if (d.params && d.params[k] != null) $('#' + k).value = d.params[k];
    if (!$('#X').value) $('#X').value = '8';
    $('#tableau').checked = !(d.params && d.params.tableau === false);
    tous.length ? majInfo() : ($('#info').textContent = 'Sauvegarde chargée, lecture de la liste en cours…');
    $('#lancer').disabled = false; $('#retirer').hidden = false;
  } catch (err) { $('#info').textContent = 'Import impossible : ' + err.message; }
  e.target.value = '';
};
$('#tableau').onchange = $('#P').oninput = majInfo;
$('#retirer').onclick = () => { save = null; majInfo(); };

$('#lancer').onclick = () => {
  params = save && save.params ? { ...save.params } : lireParams();
  if (!(params.Y + params.Z > 0)) { $('#info').textContent = 'Les points de victoire et de défaite ne peuvent pas être tous les deux à 0 : aucun groupe ne pourrait être départagé.'; return; }
  let items, reprise = null;
  if (!save) items = participants();
  else if (save.etape === 'bracket') { items = nomsSave(save); reprise = { etape: 'bracket', ub: save.upper, lb: save.lower, r: save.r }; }
  else if (save.etape === 'groupes') { items = save.musiques; reprise = { etape: 'groupes', phase: save.phase, restants: save.restants, gagnants: save.gagnants }; }
  else { items = []; reprise = save; }
  t = Tournoi.create(items, params, () => {}, reprise);
  afficher();
};

/* PokéAPI (résultats gardés en cache) */
const cache = new Map();
const api = (ep, id) => fetch(`https://pokeapi.co/api/v2/${ep}/${id}`).then(r => { if (!r.ok) throw new Error(); return r.json(); });
const infos = id => {
  if (!cache.has(id)) cache.set(id, Promise.allSettled([api('pokemon', id), api('pokemon-species', id)]).then(([p, s]) => {
    if (!p.value) cache.delete(id);
    return { p: p.value, s: s.value };
  }));
  return cache.get(id);
};
const texteSur = hex => { const n = parseInt(hex.slice(1), 16), l = .299 * (n >> 16) + .587 * ((n >> 8) & 255) + .114 * (n & 255); return l > 150 ? '#1b1526' : '#fff'; };

function carte(k, avecBouton) {
  const c = el('article', 'panneau carte');
  const img = el('div', 'pokeimg vide', '…');
  const corps = el('div', 'corps');
  c.append(img, el('p', 'numero', `N° ${String(idDe(k)).padStart(4, '0')}`), el('h2', null, nomDe(k)), corps);
  corps.append(el('p', 'meta', 'Chargement des informations…'));
  if (avecBouton) {
    const b = el('button', 'principal', 'Choisir'); b.onclick = () => choisir(k); c.append(b);
  }
  infos(idDe(k)).then(({ p, s }) => {
    if (!c.isConnected) return;
    corps.replaceChildren();
    if (!p) { corps.append(el('p', 'manque', "Informations indisponibles (PokéAPI injoignable ou Pokémon inconnu). Tu peux quand même voter.")); img.textContent = '?'; return; }
    const src = (p.sprites.other && p.sprites.other['official-artwork'].front_default) || p.sprites.front_default;
    if (src) { const i = el('img', 'pokeimg'); i.src = src; i.alt = nomDe(k); i.loading = 'lazy'; img.replaceWith(i); } else img.textContent = 'Pas d\'image';
    const types = el('div', 'types');
    p.types.forEach(({ type }) => { const [fr, col] = TYPES[type.name] || [type.name, '#888']; const x = el('span', 'type', fr); x.style.background = col; x.style.color = texteSur(col); types.append(x); });
    corps.append(types);
    const genre = s && (s.genera.find(g => g.language.name === 'fr') || {}).genus;
    if (genre) corps.append(el('p', 'meta', genre));
    corps.append(el('p', 'faits', `${p.height / 10} m · ${p.weight / 10} kg`));
    const st = el('div', 'stats'); let total = 0;
    p.stats.forEach(({ base_stat: v, stat }) => {
      total += v;
      const b = el('div', 'barre-stat'), i = document.createElement('i'); i.style.width = Math.min(100, v / 2.55) + '%'; b.append(i);
      st.append(el('span', null, STATS[stat.name] || stat.name), el('span', null, v), b);
    });
    st.append(el('strong', null, 'Total'), el('strong', null, total), document.createElement('span'));
    corps.append(st);
    const url = p.cries && (p.cries.latest || p.cries.legacy);
    if (url) {
      const b = el('button', null, 'Écouter le cri');
      b.onclick = () => { if (cri) cri.pause(); cri = new Audio(url); cri.play().catch(() => {}); };
      corps.append(b);
    }
  });
  return c;
}

function afficher() {
  const d = t.duel;
  if (!d) return fin();
  $('#setup').hidden = true; $('#fin').hidden = true; $('#duel').hidden = false;
  $('#etiquette').textContent = Tournoi.libelle(d);
  $('#progression').textContent = `Duel ${d.n} sur ${d.total}`;
  const ul = $('#scores'); ul.replaceChildren();
  if (d.scores) Object.entries(d.scores).sort((a, b) => b[1] - a[1]).forEach(([k, v]) => ul.append(el('li', null, `${nomDe(k)} : ${v} pt`)));
  $('#cartes').replaceChildren(carte(d.a, true), carte(d.b, true));
}

function choisir(k) { if (cri) cri.pause(); t.choose(k); afficher(); }

function fin() {
  $('#duel').hidden = true; $('#fin').hidden = false;
  $('#champion').replaceChildren(el('div', 'etiquette', 'Ton Pokémon préféré'), carte(t.champion, false));
}

const exporter = () => Sauvegarde.exporter(TYPE, { params, ...t.snapshot() }, 'sauvegarde-tournoi-pokemon.json');
$('#exp').onclick = $('#exp2').onclick = exporter;
$('#quit').onclick = () => {
  if (!confirm("Abandonner le tournoi en cours ? Pense à exporter la sauvegarde avant.")) return;
  t = null; save = null; $('#duel').hidden = true; $('#setup').hidden = false; majInfo();
};
$('#nouveau').onclick = () => { t = null; save = null; $('#fin').hidden = true; $('#setup').hidden = false; majInfo(); };

document.addEventListener('keydown', e => {
  if (!t || !t.duel || $('#duel').hidden || ['INPUT', 'SELECT'].includes(e.target.tagName)) return;
  if (e.key === '1') choisir(t.duel.a);
  if (e.key === '2') choisir(t.duel.b);
});
window.onbeforeunload = () => (t && t.duel ? '' : undefined);
$('#blocX').hidden = false;
</script>
</body>
</html>
